<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
     *html{
        margin: 0;
        padding: 0;
     }
     ul{
        list-style-type: none;
        margin-top: 10px;
        display: flex;
        justify-content: center;
        background-color: #333;
     }
     ul li{
        margin: 0px 10px;
        }
        ul li a{
            text-decoration: none;
            color: white;
            padding: 5px 6px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }
        ul li a:hover{
            color: black;
            font-size: 14px;
            text-decoration: underline;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
    </style>

</head>
<body>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="list.html" target="_blank">About</a></li>
        <li><a href="flexlayout.html">Flex Layout</a></li>
        <li><a href="Grid layout/layout1.html">Grid Layout</a></li>
        <li><a href="demo.html">Demo</a></li>
    </ul>
</body>
</html>
