
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SatvikMart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f8f1;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000015;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            color: #168344;
            margin-bottom: 20px;
        }

        .logo span {
            color: #f49a26;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #243328;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline-color: #168344;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: -8px;
            margin-bottom: 18px;
            font-size: 13px;
            color: #555;
        }

        .show-password input {
            width: auto;
            margin: 0;
        }

        .show-password label {
            margin: 0;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #168344;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #106b35;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #168344;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #168344;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1 class="logo">Satvik<span>Mart</span></h1>

        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to continue shopping</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                minlength="6"
                required
            >

            <div class="show-password">
                <input type="checkbox" id="showPassword">
                <label for="showPassword">Show password</label>
            </div>

            <button type="submit">Login</button>

            <p id="message"></p>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

    <script>
        const password = document.getElementById("password");
        const showPassword = document.getElementById("showPassword");
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        showPassword.addEventListener("change", function () {
            password.type = this.checked ? "text" : "password";
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            message.textContent =
                "Demo login successful! Welcome to SatvikMart.";
        });
    </script>

</body>
</html>
